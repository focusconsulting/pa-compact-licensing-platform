# The local stack: every external service the app uses, replaced by a local
# server it reaches through its production client (constitution Principle IV).
# Names, ports, and settings follow the contract in .env.example.
services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: licensing
      POSTGRES_PASSWORD: secret123
      POSTGRES_DB: licensing
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "licensing", "-d", "licensing"]
      interval: 1s
      timeout: 2s
      retries: 30

  # Email: SMTP on 1025; read mail at http://localhost:1080
  maildev:
    image: maildev/maildev:2.2.1
    ports:
      - "1025:1025"
      - "1080:1080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:1080/healthz"]
      interval: 2s
      timeout: 2s
      retries: 15

  # File storage: S3 API on 9300; console at http://localhost:9301. Published
  # on 93xx because Zscaler holds 9000 and 9010 on Focus laptops.
  rustfs:
    image: rustfs/rustfs:1.0.3
    ports:
      - "9300:9000"
      - "9301:9001"
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
      RUSTFS_CONSOLE_ENABLE: "true"

  # Creates the documents bucket with AWS's own CLI, then exits.
  rustfs-init:
    image: amazon/aws-cli:2.31.18
    depends_on: [rustfs]
    environment:
      AWS_ACCESS_KEY_ID: rustfsadmin
      AWS_SECRET_ACCESS_KEY: rustfsadmin
      AWS_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for i in $$(seq 30); do aws --endpoint-url http://rustfs:9000 s3api list-buckets >/dev/null 2>&1 && break; sleep 1; done
        aws --endpoint-url http://rustfs:9000 s3api head-bucket --bucket documents 2>/dev/null \
          || aws --endpoint-url http://rustfs:9000 s3api create-bucket --bucket documents

  # Sign-in: the local Cognito mock (engineering/mocks/cognito)
  cognito-local:
    build: ../mocks/cognito
    ports:
      - "9229:9229"
    environment:
      COGNITO_USER_POOL_ID: local_licensing
      COGNITO_CLIENT_ID: licensing-local-client
      COGNITO_ENDPOINT_URL: http://localhost:9229
      SIGNING_KEY_FILE: /data/signing-key.pem
    volumes:
      - cognito-data:/data

  # Sign-in: cognito-local with the local users (engineering/mocks/cognito)
  cognito-local:
    build: ../mocks/cognito
    ports:
      - "${COGNITO_PORT:-9229}:9229"

volumes:
  cognito-data:
