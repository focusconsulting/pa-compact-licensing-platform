# The local stack: every external service the app uses, replaced by a local
# server it reaches through its production client (constitution Principle IV).
# Names, ports, and settings follow the contract in .env.example.
services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: licensing
      POSTGRES_PASSWORD: secret123
      POSTGRES_DB: licensing
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "licensing", "-d", "licensing"]
      interval: 1s
      timeout: 2s
      retries: 30

  # Email: SMTP on 1025; read mail at http://localhost:1080
  maildev:
    image: maildev/maildev:2.2.1
    ports:
      - "${SMTP_PORT:-1025}:1025"
      - "${MAILDEV_UI_PORT:-1080}:1080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:1080/healthz"]
      interval: 2s
      timeout: 2s
      retries: 15

  # File storage: S3 API on 9300; console at http://localhost:9301. Published
  # on 93xx because Zscaler holds 9000 and 9010 on Focus laptops.
  rustfs:
    image: rustfs/rustfs:1.0.3
    ports:
      - "${S3_PORT:-9300}:9000"
      - "${S3_CONSOLE_PORT:-9301}:9001"
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
      RUSTFS_CONSOLE_ENABLE: "true"
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9000/health"]
      interval: 1s
      timeout: 2s
      retries: 30

  # Creates the documents bucket with AWS's own CLI, versioned as in AWS, with
  # CORS for the browser's presigned POST from the client; then exits. Run it with
  # `docker compose run --rm rustfs-init` after `up --wait`: the profile keeps it out
  # of `up`, whose --wait fails when a one-shot container exits before it checks.
  rustfs-init:
    image: amazon/aws-cli:2.31.18
    profiles: ["init"]
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: rustfsadmin
      AWS_SECRET_ACCESS_KEY: rustfsadmin
      AWS_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        s3="aws --endpoint-url http://rustfs:9000 s3api"
        $$s3 head-bucket --bucket documents 2>/dev/null || $$s3 create-bucket --bucket documents
        $$s3 put-bucket-versioning --bucket documents --versioning-configuration Status=Enabled
        $$s3 put-bucket-cors --bucket documents --cors-configuration \
          '{"CORSRules":[{"AllowedOrigins":["http://localhost:3000"],"AllowedMethods":["POST"],"AllowedHeaders":["*"],"MaxAgeSeconds":3000}]}'

  # Malware scanning, standing in for GuardDuty: ClamAV scans each new object
  # version and malware-scanner tags it as GuardDuty does. Profile "scanner":
  # `just up` and `just infra` start it; CI does not, since the API tests write
  # the tag themselves. Signatures are kept in .clamav/ across `infra-down -v`.
  clamav:
    image: clamav/clamav-debian:1.5.1
    profiles: ["scanner"]
    volumes:
      - ./.clamav:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 5s
      timeout: 5s
      retries: 12
      # The first start downloads the signatures.
      start_period: 300s

  # Reads the bucket and RustFS's keys from the API's .env, reaching RustFS
  # inside the Compose network.
  malware-scanner:
    build: ../mocks/malware-scanner
    profiles: ["scanner"]
    depends_on:
      clamav:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      S3_ENDPOINT_URL: http://rustfs:9000
      CLAMD_HOST: clamav

  # Sign-in: cognito-local with the local users (engineering/mocks/cognito)
  cognito-local:
    build: ../mocks/cognito
    ports:
      - "${COGNITO_PORT:-9229}:9229"
