name: Release

# A tag promotes a commit: v*-rc* deploys staging, any other v* deploys prod, each
# through its GitHub Environment's required reviewers.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  target:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.map.outputs.environment }}
    steps:
      - id: map
        run: |
          case "$GITHUB_REF_NAME" in
            v*-rc*) echo "environment=staging" >> "$GITHUB_OUTPUT" ;;
            v*)     echo "environment=prod" >> "$GITHUB_OUTPUT" ;;
          esac

  deploy:
    needs: target
    # A called workflow gets no more than its caller grants; deploy.yml assumes
    # its AWS role through OIDC.
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy.yml
    with:
      environment: ${{ needs.target.outputs.environment }}
