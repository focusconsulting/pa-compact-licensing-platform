name: ZAP

# A nightly passive OWASP ZAP baseline scan of staging, the only deployed environment
# (SCRUM-75). It fails on a medium or high alert not marked IGNORE in .zap/rules.tsv,
# and keeps one open issue with the latest report for triage before sprint acceptance.
on:
  schedule:
    - cron: "41 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7

      - uses: zaproxy/action-baseline@6c5a007541891231cd9e0ddec25d4f25c59c9874 # v0.15.0
        with:
          target: https://site.dev-pacompact.aws.focusconsulting.io
          docker_name: ghcr.io/zaproxy/zaproxy:2.17.0
          rules_file_name: .zap/rules.tsv
          issue_title: "ZAP baseline: staging"
          artifact_name: zap-baseline
          # The next step decides by severity; ZAP's own exit status counts every warning.
          fail_action: false

      - name: Fail on medium or worse
        run: python3 scripts/security/findings-gate.py zap .zap/rules.tsv report_json.json
