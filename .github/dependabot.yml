version: 2
updates:
  # JavaScript (engineering/client/)
  - package-ecosystem: npm
    directory: /engineering/client
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      npm-all:
        patterns: ["*"]
    ignore:
      # TypeScript 7 ships no compiler API, which Next 14, typescript-eslint
      # and Storybook all load.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # plugin-react 6 needs vite 8; vitest 3 runs on vite 7.
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]

  # Python / uv (engineering/api/)
  - package-ecosystem: uv
    directory: /engineering/api
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      pip-all:
        patterns: ["*"]

  # Terraform providers — app component
  - package-ecosystem: terraform
    directory: /engineering/infrastructure/iac/components/app/terraform
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      terraform-app-all:
        patterns: ["*"]

  # Terraform providers — ecr component
  - package-ecosystem: terraform
    directory: /engineering/infrastructure/iac/components/ecr/terraform
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      terraform-ecr-all:
        patterns: ["*"]

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      actions-all:
        patterns: ["*"]

  # cognito-local image (engineering/mocks/cognito/, local tooling)
  - package-ecosystem: docker
    directory: /engineering/mocks/cognito
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
