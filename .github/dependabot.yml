version: 2
updates:
  # JavaScript (engineering/client/)
  - package-ecosystem: npm
    directory: /engineering/client
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      # Majors stay out of the group, so one breaking upgrade can't hold back
      # the safe ones; each opens its own PR.
      npm-all:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # TypeScript 7 ships no compiler API, which Next 14, typescript-eslint
      # and Storybook all load.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # plugin-react 6 needs vite 8; vitest 3 runs on vite 7.
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]

  # Python / uv (engineering/api/)
  - package-ecosystem: uv
    directory: /engineering/api
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      pip-all:
        patterns: ["*"]

  # OpenTofu providers — app component
  - package-ecosystem: terraform
    directory: /engineering/infrastructure/iac/components/app/opentofu
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      opentofu-app-all:
        patterns: ["*"]

  # OpenTofu providers — ecr component
  - package-ecosystem: terraform
    directory: /engineering/infrastructure/iac/components/ecr/opentofu
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      opentofu-ecr-all:
        patterns: ["*"]

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      actions-all:
        patterns: ["*"]

  # cognito-local image (engineering/mocks/cognito/, local tooling)
  - package-ecosystem: docker
    directory: /engineering/mocks/cognito
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5

  # JavaScript (engineering/e2e/, Playwright)
  - package-ecosystem: npm
    directory: /engineering/e2e
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      e2e-all:
        patterns: ["*"]
